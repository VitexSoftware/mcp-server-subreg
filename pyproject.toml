[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-server-subreg"
version = "0.1.4"
description = "MCP server exposing the Subreg.cz domain registrar SOAP API (subreg-client) as tools"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vítězslav Dvořák", email = "info@vitexsoftware.cz" }]
dependencies = [
    "subreg-client @ git+https://github.com/Spoje-NET/python3-subreg-client.git",
    "fastmcp>=4.1.4",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Internet :: Name Service (DNS)",
]

[project.scripts]
mcp-server-subreg = "mcp_server_subreg.server:main"

[project.urls]
Homepage = "https://github.com/VitexSoftware/mcp-server-subreg"

[dependency-groups]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
